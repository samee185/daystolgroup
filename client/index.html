<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1330" />
    <!-- Picks light or dark mode before the page paints (no flash) -->
    <script src="/theme-init.js"></script>
    <title>Daystol Group Ltd. | Power, ICT, Property and Construction in Nigeria</title>
    <meta name="description" content="Daystol Group Ltd. is the parent of Daystol Power Services, Innovation Systems, Property and Development Concept, serving Lagos, Abuja and all of Nigeria." />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/brand/daystol-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      Preloader: written into the page so it shows instantly with nothing extra to download.
      First visit in a session: the four company cables power up the logo (about a second).
      Later pages, or when animations are turned off: a plain logo that only appears if loading is slow.
      It is removed as soon as the app is ready.
    -->
    <style>
      #dz-boot{--b:#0D1330;--l:#2A335E;--t:#F2F4FA;--m:#B9C0D9;position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--b);color:var(--t);font-family:'Instrument Sans',system-ui,sans-serif;transition:opacity .4s ease,visibility .4s}
      [data-theme="light"] #dz-boot{--b:#F5F7FC;--l:#DCE1EE;--t:#0D1330;--m:#4A5375}
      #dz-boot svg{position:absolute;inset:0;width:100%;height:100%}
      #dz-boot .c{stroke-dasharray:700;stroke-dashoffset:700;animation:dzDraw .75s cubic-bezier(.6,0,.2,1) forwards}
      #dz-boot .p{stroke-dasharray:60 640;stroke-dashoffset:700;animation:dzPulse 1.3s ease-in infinite}
      #dz-boot .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;padding:0 16px;text-align:center}
      #dz-boot .logo{width:120px;height:120px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px rgba(0,0,0,.3);animation:dzPop .55s cubic-bezier(.2,.9,.2,1) .45s both}
      #dz-boot .logo img{width:80px;height:auto}
      #dz-boot .w{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:14px;font-weight:700}
      #dz-boot .w span{display:flex;align-items:center;gap:7px;opacity:0;animation:dzUp .4s ease-out forwards}
      #dz-boot .w i{width:8px;height:8px;border-radius:99px}
      #dz-boot .bar{width:220px;height:5px;border-radius:99px;overflow:hidden;display:flex;gap:3px;background:var(--l)}
      #dz-boot .bar i{flex:1;transform-origin:left;transform:scaleX(0);animation:dzFill .3s ease-out forwards}
      #dz-boot .rc{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:13px;color:var(--m)}
      #dz-boot.dz-quick{opacity:0;animation:dzShow .2s ease .3s forwards}
      #dz-boot.dz-quick svg,#dz-boot.dz-quick .w,#dz-boot.dz-quick .bar,#dz-boot.dz-quick .rc{display:none}
      #dz-boot.dz-quick .logo{animation:none}
      #dz-boot.dz-out{opacity:0!important;visibility:hidden;pointer-events:none}
      @keyframes dzDraw{to{stroke-dashoffset:0}}
      @keyframes dzPulse{0%{stroke-dashoffset:700;opacity:0}15%,80%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
      @keyframes dzPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
      @keyframes dzUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes dzFill{to{transform:scaleX(1)}}
      @keyframes dzShow{to{opacity:1}}
    </style>
    <noscript><style>#dz-boot{display:none}</style></noscript>
  </head>
  <body>
    <div id="dz-boot" role="status" aria-label="Loading Daystol Group">
      <svg aria-hidden="true" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
        <g fill="none" stroke-width="9" stroke-linecap="round" stroke="var(--l)">
          <path d="M-20 90 C 260 90, 380 300, 500 300" /><path d="M-20 520 C 260 520, 380 300, 500 300" />
          <path d="M1020 90 C 740 90, 620 300, 500 300" /><path d="M1020 520 C 740 520, 620 300, 500 300" />
        </g>
        <g fill="none" stroke-width="3" stroke-linecap="round">
          <path class="c" stroke="#FFE52E" d="M-20 90 C 260 90, 380 300, 500 300" />
          <path class="c" stroke="#01AFEE" style="animation-delay:.08s" d="M-20 520 C 260 520, 380 300, 500 300" />
          <path class="c" stroke="#EB268F" style="animation-delay:.16s" d="M1020 90 C 740 90, 620 300, 500 300" />
          <path class="c" stroke="#FF7A1A" style="animation-delay:.24s" d="M1020 520 C 740 520, 620 300, 500 300" />
          <path class="p" stroke="#FFFFFF" style="animation-delay:.8s" d="M-20 90 C 260 90, 380 300, 500 300" />
          <path class="p" stroke="#FFFFFF" style="animation-delay:1.1s" d="M-20 520 C 260 520, 380 300, 500 300" />
          <path class="p" stroke="#FFFFFF" style="animation-delay:1.4s" d="M1020 90 C 740 90, 620 300, 500 300" />
          <path class="p" stroke="#FFFFFF" style="animation-delay:1.7s" d="M1020 520 C 740 520, 620 300, 500 300" />
        </g>
      </svg>
      <div class="in">
        <div class="logo"><img src="/brand/daystol-logo.png" alt="" width="80" height="37" /></div>
        <div class="w" aria-hidden="true">
          <span style="animation-delay:.65s"><i style="background:#FFE52E"></i>Power</span>
          <span style="animation-delay:.73s"><i style="background:#01AFEE"></i>Systems</span>
          <span style="animation-delay:.81s"><i style="background:#EB268F"></i>Property</span>
          <span style="animation-delay:.89s"><i style="background:#FF7A1A"></i>Construction</span>
        </div>
        <div class="bar" aria-hidden="true">
          <i style="background:#FFE52E;animation-delay:.7s"></i><i style="background:#01AFEE;animation-delay:.82s"></i><i style="background:#EB268F;animation-delay:.94s"></i><i style="background:#FF7A1A;animation-delay:1.06s"></i>
        </div>
      </div>
      <span class="rc">Daystol Group Ltd. · RC 9511880</span>
    </div>
    <script src="/boot.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
